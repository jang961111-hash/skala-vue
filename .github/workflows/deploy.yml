# GitHub Pages 자동 배포
# main 브랜치에 push 될 때마다 Vite 로 빌드하여 정적 호스팅한다.
# 교재 4p [과제 제출] "배포결과 제출 : Vercel, Netlify, GitHub Pages 등을 통해
# 정적 웹 호스팅을 완료한 경우 제출한다" 항목 충족용.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # 저장소명이 바뀌면 이 값도 함께 바꿔야 한다.
          VITE_BASE: /skala-vue/
          # OpenWeather API 키 (교재 265p 환경 변수)
          #
          # 저장소 Settings > Secrets and variables > Actions 에 등록한 값을
          # 빌드 시점에만 주입한다. 소스에도, 이 워크플로 파일에도 값은 없다.
          #
          # ⚠️ 알고 쓰는 한계
          #   import.meta.env.VITE_* 는 런타임 조회가 아니라 빌드 타임
          #   문자열 치환이다. 따라서 이 키는 배포된 JS 번들 안에 그대로
          #   남는다. Git 소스에서는 감춰지지만 브라우저에서는 보인다.
          #   프론트엔드 전용 앱의 구조적 한계이며, 근본 해결책은 키를
          #   백엔드 프록시 뒤에 두고 프론트는 자체 서버만 호출하는 것이다.
          #   (무료 등급 키라 노출 시 영향이 제한적이라 판단해 이대로 둠)
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
        run: npm run build

      - name: SPA fallback
        # GitHub Pages 는 정적 파일 서버라 /about 로 새로고침하면 404 를 낸다.
        # index.html 을 404.html 로 복사해 두면 Vue Router 가 경로를 이어받는다.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
