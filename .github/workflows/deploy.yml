# GitHub Pages 자동 배포
# main 브랜치에 push 될 때마다 Vite 로 빌드하여 정적 호스팅한다.
# 교재 4p [과제 제출] "배포결과 제출 : Vercel, Netlify, GitHub Pages 등을 통해
# 정적 웹 호스팅을 완료한 경우 제출한다" 항목 충족용.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # 저장소명이 바뀌면 이 값도 함께 바꿔야 한다.
          VITE_BASE: /skala-vue/
        run: npm run build

      - name: SPA fallback
        # GitHub Pages 는 정적 파일 서버라 /about 로 새로고침하면 404 를 낸다.
        # index.html 을 404.html 로 복사해 두면 Vue Router 가 경로를 이어받는다.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
